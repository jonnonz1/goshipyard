name: cli-release

# Build standalone CLI binaries and attach them to a GitHub release.
# Trigger by pushing a tag like `cli-v0.1.0`.
on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - name: Verify the deployed API before publishing
        run: bun run contract:check --url https://goshipyard.app/api/v1/openapi.json
      - run: bun run cli:release
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/shipyard-*
